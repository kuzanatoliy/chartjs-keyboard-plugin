name: trigger updatess
on:
  workflow_run:
    workflows: ['pipeline']
    types:
      - completed
  workflow_dispatch:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: updates
    steps:
      - name: Trigger Autotests
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PLUGIN_UPDATES }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'kuzanatoliy',
              repo: 'chartjs-demo',
              workflow_id: 'update-plugin.yml',
              ref: 'master',
              inputs: {
                plugin: 'chartjs-keyboard-plugin'
              }
            });
